# Sistema completo: API de reservas + PostgreSQL.
#   Local:       cp .env.example .env  &&  docker compose up -d --build
#   Despliegue:  scripts/deploy.sh <imagen:tag>   (lo usa el pipeline de CD en el runner autohospedado)
#   Prueba SLO:  scripts/slo.sh                    (servicio k6, no arranca con "up")
#   Apagar:      docker compose down -v
# Los valores salen del archivo .env o de las variables de entorno del pipeline.
# Las que tienen :? son obligatorias: si faltan, Compose se detiene con el mensaje indicado.
name: reservas

services:

  app:
    image: ${APP_IMAGE:-reservas:local}
    build: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-reservas}
      DB_USUARIO: ${POSTGRES_USER:?Defina POSTGRES_USER (ver .env.example)}
      DB_CLAVE: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD (ver .env.example)}
      GESTOR_USUARIO: ${GESTOR_USUARIO:?Defina GESTOR_USUARIO (ver .env.example)}
      GESTOR_CLAVE: ${GESTOR_CLAVE:?Defina GESTOR_CLAVE (ver .env.example)}
      CONSULTA_USUARIO: ${CONSULTA_USUARIO:?Defina CONSULTA_USUARIO (ver .env.example)}
      CONSULTA_CLAVE: ${CONSULTA_CLAVE:?Defina CONSULTA_CLAVE (ver .env.example)}
    ports:
      - "8090:8080"
    depends_on:
      postgres:
        condition: service_healthy
    # El healthcheck está definido en el Dockerfile (HEALTHCHECK).
    restart: unless-stopped
    # Endurecimiento: sistema de archivos de solo lectura, sin capacidades de Linux y sin escalar privilegios.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Límites de recursos: un pico de carga no puede consumir toda la máquina.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 768M

  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reservas}
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER (ver .env.example)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD (ver .env.example)}
    # Solo accesible desde la misma máquina (127.0.0.1), para depurar con un cliente SQL.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - datos-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  # Prueba de carga corta con los umbrales del SLO (perf/slo.js). Se ejecuta con scripts/slo.sh.
  k6:
    image: grafana/k6:2.3.0
    profiles: ["pruebas"]
    volumes:
      - ./perf:/perf:ro
    environment:
      BASE_URL: http://app:8080
      GESTOR_USUARIO: ${GESTOR_USUARIO:?Defina GESTOR_USUARIO (ver .env.example)}
      GESTOR_CLAVE: ${GESTOR_CLAVE:?Defina GESTOR_CLAVE (ver .env.example)}
      CONSULTA_USUARIO: ${CONSULTA_USUARIO:?Defina CONSULTA_USUARIO (ver .env.example)}
      CONSULTA_CLAVE: ${CONSULTA_CLAVE:?Defina CONSULTA_CLAVE (ver .env.example)}
      DURACION: ${SLO_DURACION:-30s}
      TASA: ${SLO_TASA:-20}
    command: ["run", "/perf/slo.js"]

volumes:
  datos-postgres:
